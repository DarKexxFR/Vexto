name: CI

on:
  push:
    paths: ["vexto/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["vexto/**", ".github/workflows/ci.yml"]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vexto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vexto/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci
      - name: Web build (no secrets needed)
        run: npx expo export --platform web --output-dir dist
